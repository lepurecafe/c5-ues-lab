  <text x="154" y="824" fill="#F2EDE5" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="7">COPY RING</text>
  <text x="154" y="870" fill="#A89F92" font-family="Courier New, monospace" font-size="19" letter-spacing="3">DRIVE / 124 BPM / BB-06</text>
  <text x="710" y="870" fill="#F2EDE5" font-family="Courier New, monospace" font-size="15" letter-spacing="3">SYNTHETIC</text>
</svg>
