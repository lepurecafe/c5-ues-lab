<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="beat06-title beat06-desc">
  <title id="beat06-title">Synthetic battle beat cover BB-06</title>
  <desc id="beat06-desc">Photocopy-style canvas cover with offset ink and red rings, halftone blocks, and hard registration marks.</desc>
  <defs>
    <pattern id="beat06-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.5" fill="#1A1713"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="#E0D8CC"/>
  <rect x="44" y="44" width="936" height="936" fill="none" stroke="#1A1713" stroke-width="7"/>
  <rect x="86" y="86" width="852" height="852" fill="url(#beat06-dots)" opacity=".2"/>
  <circle cx="482" cy="470" r="316" fill="none" stroke="#1A1713" stroke-width="74"/>
  <circle cx="540" cy="524" r="316" fill="none" stroke="#B50D14" stroke-width="46" opacity=".9"/>
  <circle cx="512" cy="498" r="174" fill="#F2EDE5" stroke="#1A1713" stroke-width="18"/>
  <path d="M126 126h88M170 82v88M810 126h88M854 82v88M126 898h88M170 854v88M810 898h88M854 854v88" stroke="#C69B4E" stroke-width="10"/>
